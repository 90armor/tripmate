name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      # The build needs no secrets: no page reads configuration at build time.
      - run: pnpm build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tripmate
          POSTGRES_PASSWORD: tripmate
          POSTGRES_DB: tripmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripmate -d tripmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Fresh, empty database on every run: the suite's global setup applies the
      # committed migrations, so this also proves migrations run from empty.
      TEST_DATABASE_URL: postgres://tripmate:tripmate@localhost:5432/tripmate_test
      # Never connected to. Set to a different database name so the test guard
      # (TEST_DATABASE_URL must differ from DATABASE_URL) is exercised in CI too.
      DATABASE_URL: postgres://tripmate:tripmate@localhost:5432/tripmate_ci_unused
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # Next CI extension (not enabled in M0, per ROADMAP §11): Playwright smoke tests.
  # They need `pnpm exec playwright install --with-deps chromium` and env values
  # for the dev server (DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL).
